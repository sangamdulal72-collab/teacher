<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Project Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            animation: gradientShift 15s ease infinite;
            background-size: 200% 200%;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            animation: titlePulse 3s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .view-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #f0f0f0;
            color: #333;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .view-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .view-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .view-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .teacher-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            animation: fadeInUp 0.6s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .teacher-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px) scale(1.02);
        }

        .btn-load {
            background: #28a745;
            margin-left: 10px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .project-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .project-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .project-card:hover::after {
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .project-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .project-title {
            color: #333;
            font-size: 1.4em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .project-subject {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            animation: badgeBounce 2s ease-in-out infinite;
        }

        @keyframes badgeBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .project-description {
            color: #666;
            line-height: 1.6;
            margin: 15px 0;
            position: relative;
            z-index: 1;
        }

        .project-meta {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
            position: relative;
            z-index: 1;
        }

        .meta-item {
            display: flex;
            align-items: center;
            color: #666;
            font-size: 0.9em;
        }

        .meta-icon {
            margin-right: 8px;
            font-weight: bold;
            color: #667eea;
        }

        .deadline-warning {
            background: #fff3cd;
            color: #856404;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9em;
            margin-top: 10px;
            animation: warningPulse 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes warningPulse {
            0%, 100% { 
                background: #fff3cd;
                transform: scale(1);
            }
            50% { 
                background: #ffeaa7;
                transform: scale(1.02);
            }
        }

        .btn-delete {
            background: #ff4757;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 10px;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .btn-delete:hover {
            background: #ff3838;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }

            .teacher-section {
                padding: 20px;
            }

            header {
                padding: 20px;
            }
        }

        .hidden {
            display: none;
        }

        .fade-in {
            animation: fadeInScale 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .material-list {
            margin-top: 10px;
            padding-left: 20px;
            color: #666;
            font-size: 0.9em;
        }

        .material-list li {
            margin: 5px 0;
        }

        .teacher-info {
            color: #667eea;
            font-weight: 600;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Project Portal</h1>
            <p class="subtitle">Share and manage student projects efficiently</p>
            <div class="view-toggle">
                <button class="view-btn active" onclick="switchView('student')">Student View</button>
                <button class="view-btn" onclick="switchView('teacher')">Teacher View</button>
                <button class="btn-primary btn-load" onclick="loadSampleData()">📥 Load Sample Data</button>
            </div>
        </header>

        <div id="teacherSection" class="teacher-section hidden">
            <h2>Create New Project</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label for="projectTitle">Project Title *</label>
                    <input type="text" id="projectTitle" required placeholder="Enter project title">
                </div>

                <div class="form-group">
                    <label for="projectSubject">Subject *</label>
                    <select id="projectSubject" required>
                        <option value="">Select Subject</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Science">Science</option>
                        <option value="English">English</option>
                        <option value="History">History</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Art">Art</option>
                        <option value="Physical Education">Physical Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="projectDescription">Description *</label>
                    <textarea id="projectDescription" required placeholder="Describe the project requirements and objectives"></textarea>
                </div>

                <div class="form-group">
                    <label for="projectDeadline">Deadline *</label>
                    <input type="date" id="projectDeadline" required>
                </div>

                <div class="form-group">
                    <label for="projectGrade">Grade/Class *</label>
                    <input type="text" id="projectGrade" required placeholder="e.g., Grade 10, Class A">
                </div>

                <div class="form-group">
                    <label for="teacherName">Teacher Name</label>
                    <input type="text" id="teacherName" placeholder="Your name">
                </div>

                <div class="form-group">
                    <label for="estimatedHours">Estimated Hours</label>
                    <input type="number" id="estimatedHours" placeholder="Estimated completion time">
                </div>

                <div class="form-group">
                    <label for="materials">Required Materials (comma-separated)</label>
                    <input type="text" id="materials" placeholder="e.g., Paper, Glue, Scissors">
                </div>

                <button type="submit" class="btn-primary">📤 Publish Project</button>
            </form>
        </div>

        <div id="studentSection" class="teacher-section">
            <h2>Active Projects</h2>
            <div id="projectsList" class="projects-grid"></div>
        </div>
    </div>

    <script>
        let projects = [];

        // Sample JSON data embedded
        const sampleData = {
            "projects": [
                {
                    "id": 1698765432100,
                    "title": "Solar System Model",
                    "subject": "Science",
                    "description": "Create a 3D model of the solar system showing all planets, their relative sizes, and distances from the sun. Include labels and interesting facts about each planet.",
                    "deadline": "2025-11-15",
                    "grade": "Grade 6, Class B",
                    "createdDate": "2025-11-01",
                    "teacherName": "Ms. Johnson",
                    "estimatedHours": 8,
                    "materials": ["Styrofoam balls", "Paint", "Wire or string", "Cardboard base"]
                },
                {
                    "id": 1698765432101,
                    "title": "Historical Timeline Presentation",
                    "subject": "History",
                    "description": "Research and create a detailed timeline of major events during World War II. Include images, dates, key figures, and the impact of each event.",
                    "deadline": "2025-11-20",
                    "grade": "Grade 10, Class A",
                    "createdDate": "2025-10-28",
                    "teacherName": "Mr. Peterson",
                    "estimatedHours": 12,
                    "materials": ["Research materials", "Presentation software", "Historical photographs"]
                },
                {
                    "id": 1698765432102,
                    "title": "Poetry Anthology",
                    "subject": "English",
                    "description": "Compile an anthology of 10 original poems exploring different themes and styles. Include at least three different poetic forms (sonnet, haiku, free verse, etc.).",
                    "deadline": "2025-11-10",
                    "grade": "Grade 9, Class C",
                    "createdDate": "2025-10-25",
                    "teacherName": "Mrs. Williams",
                    "estimatedHours": 10,
                    "materials": ["Writing notebook", "Poetry reference books"]
                },
                {
                    "id": 1698765432103,
                    "title": "Geometry Art Project",
                    "subject": "Mathematics",
                    "description": "Create an artistic design using geometric shapes and transformations. Include examples of rotation, reflection, translation, and tessellation.",
                    "deadline": "2025-11-18",
                    "grade": "Grade 8, Class A",
                    "createdDate": "2025-11-02",
                    "teacherName": "Mr. Davis",
                    "estimatedHours": 6,
                    "materials": ["Graph paper", "Ruler and compass", "Colored pencils", "Protractor"]
                },
                {
                    "id": 1698765432104,
                    "title": "Simple Game Development",
                    "subject": "Computer Science",
                    "description": "Design and develop a simple interactive game using Scratch or Python. The game should include user input, scoring system, and at least three levels of difficulty.",
                    "deadline": "2025-11-25",
                    "grade": "Grade 11, Class B",
                    "createdDate": "2025-10-30",
                    "teacherName": "Dr. Chen",
                    "estimatedHours": 15,
                    "materials": ["Computer with internet", "Scratch or Python IDE", "Game design documentation"]
                },
                {
                    "id": 1698765432105,
                    "title": "Impressionist Painting",
                    "subject": "Art",
                    "description": "Create an original painting inspired by the Impressionist movement. Study the techniques of artists like Monet, Renoir, or Degas.",
                    "deadline": "2025-11-12",
                    "grade": "Grade 7, Class D",
                    "createdDate": "2025-10-29",
                    "teacherName": "Ms. Rodriguez",
                    "estimatedHours": 8,
                    "materials": ["Canvas or thick paper", "Acrylic or oil paints", "Brushes of various sizes", "Palette"]
                }
            ]
        };

        function loadSampleData() {
            projects = [...sampleData.projects];
            displayProjects();
            alert('✅ Sample data loaded successfully!');
        }

        function switchView(view) {
            const teacherSection = document.getElementById('teacherSection');
            const studentSection = document.getElementById('studentSection');
            const buttons = document.querySelectorAll('.view-btn');

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (view === 'teacher') {
                teacherSection.classList.remove('hidden');
                studentSection.classList.remove('hidden');
            } else {
                teacherSection.classList.add('hidden');
                studentSection.classList.remove('hidden');
            }
        }

        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const materialsInput = document.getElementById('materials').value;
            const materialsArray = materialsInput ? materialsInput.split(',').map(m => m.trim()) : [];

            const project = {
                id: Date.now(),
                title: document.getElementById('projectTitle').value,
                subject: document.getElementById('projectSubject').value,
                description: document.getElementById('projectDescription').value,
                deadline: document.getElementById('projectDeadline').value,
                grade: document.getElementById('projectGrade').value,
                createdDate: new Date().toISOString().split('T')[0],
                teacherName: document.getElementById('teacherName').value || 'Anonymous',
                estimatedHours: parseInt(document.getElementById('estimatedHours').value) || 0,
                materials: materialsArray
            };

            projects.unshift(project);
            displayProjects();
            this.reset();

            alert('✅ Project published successfully!');
        });

        function displayProjects() {
            const projectsList = document.getElementById('projectsList');

            if (projects.length === 0) {
                projectsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>No projects yet</h3>
                        <p>Click "Load Sample Data" or switch to Teacher View to create a new project</p>
                    </div>
                `;
                return;
            }

            projectsList.innerHTML = projects.map(project => {
                const daysUntilDeadline = Math.ceil((new Date(project.deadline) - new Date()) / (1000 * 60 * 60 * 24));
                const isUrgent = daysUntilDeadline <= 3 && daysUntilDeadline >= 0;

                const materialsHTML = project.materials && project.materials.length > 0 
                    ? `<div class="meta-item">
                        <span class="meta-icon">🛠️</span>
                        <div>
                            <strong>Materials:</strong>
                            <ul class="material-list">
                                ${project.materials.map(m => `<li>${m}</li>`).join('')}
                            </ul>
                        </div>
                    </div>` 
                    : '';

                return `
                    <div class="project-card fade-in">
                        <div class="project-header">
                            <div>
                                <div class="project-title">${project.title}</div>
                                <span class="project-subject">${project.subject}</span>
                            </div>
                        </div>
                        <div class="project-description">${project.description}</div>
                        <div class="project-meta">
                            ${project.teacherName ? `<div class="teacher-info">👨‍🏫 ${project.teacherName}</div>` : ''}
                            <div class="meta-item">
                                <span class="meta-icon">📅</span>
                                <span>Deadline: ${new Date(project.deadline).toLocaleDateString()}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">🎓</span>
                                <span>Grade: ${project.grade}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">📆</span>
                                <span>Posted: ${new Date(project.createdDate).toLocaleDateString()}</span>
                            </div>
                            ${project.estimatedHours ? `<div class="meta-item">
                                <span class="meta-icon">⏱️</span>
                                <span>Est. Time: ${project.estimatedHours} hours</span>
                            </div>` : ''}
                            ${materialsHTML}
                        </div>
                        ${isUrgent ? `<div class="deadline-warning">⚠️ Due in ${daysUntilDeadline} day${daysUntilDeadline !== 1 ? 's' : ''}!</div>` : ''}
                        <button class="btn-delete" onclick="deleteProject(${project.id})">🗑️ Delete</button>
                    </div>
                `;
            }).join('');
        }

        function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                projects = projects.filter(p => p.id !== id);
                displayProjects();
            }
        }

        // Set minimum date to today
        document.getElementById('projectDeadline').min = new Date().toISOString().split('T')[0];

        // Initial display
        displayProjects();
    </script>
</body>
</html>
